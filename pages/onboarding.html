<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Configura tu perfil | ASVIF</title>
</head>
<body class="pagina-onboarding">
    <main class="onboarding-contenedor">
        <section class="onboarding-tarjeta">
            <div class="onboarding-hero">
                <span class="onboarding-icono"><i class="fa-solid fa-chart-pie"></i></span>
                <p class="etiqueta">TU PUNTO DE PARTIDA</p>
                <h1>Hagamos que tu dinero trabaje para ti</h1>
                <p>Estos datos serán la base de tus indicadores, metas y decisiones financieras en ASVIF.</p>
            </div>
            <div class="onboarding-formulario">
                <div class="logo-auth">
                <img src="../assets/img/asvif_Logotipo.png" alt="Logotipo de ASVIF">
                </div>
                <form id="form-onboarding" class="form-box activo">
                <div class="campo">
                    <label for="profesion"><i class="fa-solid fa-briefcase"></i> Profesión</label>
                    <input id="profesion" type="text" maxlength="120" autocomplete="organization-title" placeholder="Ej. Diseñadora gráfica" required>
                </div>
                <div class="campo">
                    <label for="moneda"><i class="fa-solid fa-coins"></i> Moneda de tus cuentas</label>
                    <select id="moneda" required>
                        <option value="">Selecciona tu moneda</option>
                        <option value="USD">USD - Dólar estadounidense</option>
                        <option value="MXN">MXN - Peso mexicano</option>
                        <option value="NIO">NIO - Córdoba nicaragüense</option>
                        <option value="GTQ">GTQ - Quetzal guatemalteco</option>
                        <option value="HNL">HNL - Lempira hondureño</option>
                        <option value="CRC">CRC - Colón costarricense</option>
                        <option value="PAB">PAB - Balboa panameño</option>
                        <option value="COP">COP - Peso colombiano</option>
                        <option value="PEN">PEN - Sol peruano</option>
                        <option value="ARS">ARS - Peso argentino</option>
                        <option value="CLP">CLP - Peso chileno</option>
                        <option value="BRL">BRL - Real brasileño</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="salario"><i class="fa-solid fa-wallet"></i> Salario mensual</label>
                    <input id="salario" type="number" min="0.01" step="0.01" placeholder="0.00" required>
                    <small id="moneda-ayuda">La conversión a USD se calculará con el tipo de cambio actual.</small>
                </div>
                <button type="submit" class="btn-submit">Guardar y entrar</button>
                <p id="mensaje-onboarding" role="status"></p>
                </form>
            </div>
        </section>
    </main>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/onboarding.js"></script>
</body>
</html>
