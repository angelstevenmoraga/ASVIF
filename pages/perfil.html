<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/perfil.css">
    <title>Mi perfil | ASVIF</title>
</head>
<body class="pagina-protegida pagina-dashboard" data-protegida="true">
    <header class="perfil-topbar">
        <a class="dashboard-logo" href="panel.html"><img src="../assets/img/asvif123_Letras_Logo.png" alt="Logotipo de ASVIF"></a>
        <a class="volver-panel" href="panel.html"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a>
    </header>
    <main class="perfil-contenido">
        <section class="perfil-encabezado">
            <span class="perfil-avatar"><i class="fa-solid fa-circle-user"></i></span>
            <div><p class="etiqueta">CUENTA PERSONAL</p><h1>Mi perfil</h1><p>Administra la información que usaremos para personalizar ASVIF.</p></div>
        </section>
        <form id="formularioPerfil" class="perfil-formulario">
            <label for="perfilNombre">Nombre completo<input id="perfilNombre" type="text" required></label>
            <label for="perfilCorreo">Correo electrónico<input id="perfilCorreo" type="email" readonly></label>
            <label for="perfilTelefono">Número de teléfono<input id="perfilTelefono" type="tel" required></label>
            <label for="perfilNacionalidad">Nacionalidad<input id="perfilNacionalidad" type="text" required></label>
            <button type="submit">Guardar cambios</button>
            <p id="mensajePerfil" role="status"></p>
        </form>
    </main>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/perfil.js"></script>
</body>
</html>
